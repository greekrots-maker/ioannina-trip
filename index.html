<!doctype html><html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Γιάννενα Τριήμερο</title><meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Γιάννενα">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{--g:#14532d;--bg:#f4f3ef;--t:#1c1917;--m:#78716c;--tb:64px;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:16px/1.4 -apple-system,system-ui,sans-serif;overscroll-behavior:none}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(var(--st) + 10px) 16px 8px}
.top h1{margin:0;font-size:26px}.top p{margin:2px 0 0;color:var(--m);font-size:13px}
.tab{display:none;padding-bottom:calc(var(--tb) + var(--sb) + 16px)}.tab.on{display:block}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.days button{flex:0 0 auto;border:0;border-radius:14px;padding:10px 14px;background:#fff;font-size:15px;min-height:48px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.days button.on{background:var(--g);color:#fff}.days b{display:block;font-size:12px;font-weight:500;opacity:.75}
.meta{margin:0 16px 8px;color:var(--m);font-size:13px}
.row{display:flex;gap:12px;align-items:center;background:#fff;margin:8px 12px;padding:10px;border-radius:16px;min-height:72px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.row:active{transform:scale(.98)}.th{flex:0 0 60px;height:60px;border-radius:12px;background:#e7e5e4 center/cover;display:grid;place-items:center;font-size:26px}
.row .c{flex:1;min-width:0}.row .tm{font-size:12px;color:var(--g);font-weight:700}.row .n{font-weight:600;font-size:16px}.row .x{font-size:13px;color:var(--m);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .go{color:#1a73e8;font-size:20px}.charge .tm{color:#b45309}.food .tm{color:#b91c1c}.alt{opacity:.8}
#map{position:fixed;left:0;right:0;top:0;bottom:calc(var(--tb) + var(--sb))}
#mapf{position:fixed;z-index:500;left:8px;right:8px;top:calc(var(--st) + 8px);display:flex;gap:6px;overflow-x:auto}
#mapf button{border:0;border-radius:99px;padding:9px 14px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);font-size:14px;flex:0 0 auto}
#mapf button.on{background:var(--g);color:#fff}
h3{margin:18px 16px 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--m)}
.card{background:#fff;margin:8px 12px;border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.big{font-size:34px;font-weight:800}.warn{background:#fef2f2;color:#991b1b}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #f0efeb}.li:last-child{border:0}.li small{display:block;color:var(--m);font-size:12px}.li b{white-space:nowrap}
.tiny{font-size:11px;color:var(--m);margin:12px 16px}.tiny a{text-decoration:underline}
nav.tb{position:fixed;z-index:1000;left:0;right:0;bottom:0;height:calc(var(--tb) + var(--sb));padding-bottom:var(--sb);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #e7e5e4;display:flex}
nav.tb button{flex:1;border:0;background:none;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tb button span{font-size:24px;line-height:1}nav.tb button.on{color:var(--g);font-weight:700}
#hint{position:fixed;z-index:2000;left:12px;right:12px;bottom:calc(var(--tb) + var(--sb) + 12px);background:#1c1917;color:#fff;border-radius:16px;padding:14px 44px 14px 14px;font-size:14px;display:none}
#hint button{position:absolute;right:8px;top:8px;border:0;background:none;color:#fff;font-size:22px;width:36px;height:36px}
</style></head><body>
<section class="tab on" id="t-plan"><div class="top"><h1>Γιάννενα</h1><p>27–30 Οκτ · 2 άτομα · BYD Seal U</p></div><div class="days" id="days"></div><p class="meta" id="meta"></p><div id="list"></div></section>
<section class="tab" id="t-map"><div id="map"></div><div id="mapf"></div></section>
<section class="tab" id="t-places"><div class="top"><h1>Μέρη</h1><p>Πάτα για να ανοίξει στο Google Maps</p></div><div id="places"></div></section>
<section class="tab" id="t-cost"><div class="top"><h1>Κόστος</h1><p>Για 2 άτομα, όλα μέσα</p></div><div id="cost"></div></section>
<nav class="tb"><button data-t="plan" class="on"><span>🗓️</span>Πρόγραμμα</button><button data-t="map"><span>🗺️</span>Χάρτης</button><button data-t="places"><span>📍</span>Μέρη</button><button data-t="cost"><span>💶</span>Κόστος</button></nav>
<div id="hint"><button onclick="hideHint()">×</button><b>Βάλ' το στην αρχική οθόνη</b><br>Στο Safari πάτα <b>Κοινοποίηση ⬆️</b> και μετά <b>«Προσθήκη στην οθόνη Αφετηρίας»</b>. Δουλεύει και χωρίς σήμα.</div>
<script src="vendor/leaflet.js"></script><script src="routes.js"></script><script src="data.js"></script>
<script>
const E={stop:'📍',charge:'⚡',food:'🍽️',alt:'↪️',hotel:'🏨'},$=s=>document.querySelector(s);
const row=(i)=>`<a class="row ${i.ty||''}" href="${i.u}" target="_blank" rel="noopener"><div class="th" style="${i.im?`background-image:url(img/t/${i.im}.jpg)`:''}">${i.im?'':E[i.ty||'hotel']}</div><div class="c">${i.t?`<div class="tm">${i.t}</div>`:''}<div class="n">${i.n.replace(/^⚡\s*/,'')}</div><div class="x">${i.x||''}</div></div><div class="go">›</div></a>`;
// plan
function pickDay(d){document.querySelectorAll('#days button').forEach(b=>b.classList.toggle('on',b.dataset.d==d));const y=D.days[d];$('#meta').textContent=`${y.ti} · 🚗 ${y.km} χλμ · ${Math.floor(y.mn/60)}ω${String(y.mn%60).padStart(2,'0')} · ${y.w}`;$('#list').innerHTML=D.items.filter(i=>i.d==d).map(row).join('');localStorage.day=d}
$('#days').innerHTML=Object.entries(D.days).map(([d,y])=>`<button data-d="${d}" onclick="pickDay(${d})"><b>Μέρα ${d}</b>${y.dt.split(' ')[0]} ${y.dt.split(' ')[1]}</button>`).join('');
const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Athens'}).format(new Date()),TM={'2026-10-27':1,'2026-10-28':2,'2026-10-29':3,'2026-10-30':4};
pickDay(TM[today]||localStorage.day||1);
// places
const seen=new Set(),uniq=a=>a.filter(i=>!seen.has(i.u)&&seen.add(i.u));const skip=/^(Αναχώρηση|Άφιξη Αθήνα)/;
const G=[['Αξιοθέατα',D.items.filter(i=>(i.ty=='stop'||i.ty=='alt')&&!skip.test(i.n))],['Φαγητό',D.items.filter(i=>i.ty=='food')],['Φόρτιση',D.items.filter(i=>i.ty=='charge')],['Διαμονή (υποψήφια, TBD)',D.hot.map(h=>({...h,ty:'hotel'}))]];
$('#places').innerHTML=G.map(([h,a])=>`<h3>${h}</h3>`+uniq(a).map(i=>row({...i,t:''})).join('')).join('');
// cost
$('#cost').innerHTML=`<div class="card"><div class="big">${D.tot}</div><div style="color:#78716c">ανάλογα με το ξενοδοχείο</div></div>
<div class="card warn">⚠️ Δεν χωράει στα €400. Είναι <b>${D.over}</b> πάνω.</div>
<div class="card">${D.br.map(b=>`<div class="li"><div>${b.a}<small>${b.c}</small></div><b>${b.v}</b></div>`).join('')}</div>
<h3>Πού γλιτώνουμε</h3><div class="card"><div class="li"><div>Ξενοδοχείο με δωρεάν φόρτιση</div><b>−€46</b></div><div class="li"><div>Φθηνά μεσημεριανά (πίτες, φούρνος)</div><b>−€60–80</b></div><div class="li"><div>Gousias αντί για €220</div><b>−€68</b></div><div class="li"><div>2 νύχτες αντί 3</div><b>−€50–75</b></div><div class="li"><div>Χωρίς Μέτσοβο</div><b>−€10</b></div></div>
<h3>Φόρτιση</h3><div class="card" style="font-size:14px">87 kWh μπαταρία · ~24 kWh/100 χλμ στην εθνική. Μία στάση DC στο Αγρίνιο σε κάθε διαδρομή, AC στην Κανάρη (Γιάννενα). App <b>PPC blue</b>, ως μέλος: AC €0,40 / DC €0,52 ανά kWh.</div>
<p class="tiny">Φωτογραφίες: Wikimedia Commons · ${Object.entries(D.cr).map(([k,c])=>`<a href="${c.p}" target="_blank">${k}</a> (${c.a}, ${c.l})`).join(' · ')} · Χάρτης © OpenStreetMap</p>`;
// map
let map,lines={};const C={d1:'#14532d',d2:'#b45309',d3:'#1d4ed8',d3m:'#7c3aed',d4:'#be123c'};
function initMap(){map=L.map('map',{zoomControl:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
for(const k in ROUTES)lines[k]=L.polyline(ROUTES[k].coords,{color:C[k],weight:5,opacity:.85,dashArray:k=='d3m'?'8 8':null}).addTo(map);
const ic=e=>L.divIcon({html:`<div style="font-size:24px">${e}</div>`,className:'',iconSize:[28,28],iconAnchor:[14,24]});
const pop=i=>`<b>${i.n}</b><br><a href="${i.u}" target="_blank" style="color:#1a73e8;font-size:15px">Άνοιγμα στο Google Maps ›</a>`;
uniq2(D.items).forEach(i=>L.marker([i.la,i.lo],{icon:ic(E[i.ty])}).bindPopup(pop(i)).addTo(map));D.hot.forEach(h=>L.marker([h.la,h.lo],{icon:ic('🏨')}).bindPopup(pop(h)).addTo(map));
$('#mapf').innerHTML=[['all','Όλα'],['d1','Τρ'],['d2','Τε'],['d3','Πε'],['d3m','Μέτσοβο'],['d4','Πα']].map(([k,t])=>`<button data-k="${k}" onclick="fit('${k}')">${t}</button>`).join('');fit(localStorage.day?'d'+localStorage.day:'all')}
function uniq2(a){const s=new Set();return a.filter(i=>!s.has(i.u)&&s.add(i.u))}
function fit(k){document.querySelectorAll('#mapf button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));map.fitBounds((k=='all'?L.featureGroup(Object.values(lines)):lines[k]).getBounds(),{padding:[50,30]})}
// tabs
function tab(t){document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id=='t-'+t));document.querySelectorAll('nav.tb button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));if(t=='map'){if(!map)initMap();setTimeout(()=>map.invalidateSize(),50)}scrollTo(0,0);location.hash=t}
document.querySelectorAll('nav.tb button').forEach(b=>b.onclick=()=>tab(b.dataset.t));if(location.hash.length>1)tab(location.hash.slice(1));
// install hint
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),sa=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
function hideHint(){$('#hint').style.display='none';localStorage.hint=1}if(ios&&!sa&&!localStorage.hint)$('#hint').style.display='block';
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
